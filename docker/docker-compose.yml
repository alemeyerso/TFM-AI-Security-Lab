# =============================================================
# AI Security Lab — Docker Compose
# TFM 2025 · Aleja & Juan
#
# IMPORTANTE: Ollama debe estar corriendo en el HOST, no aquí.
# Instala Ollama en tu máquina y descarga los modelos antes
# de ejecutar este compose.
#
# Uso:
#   docker compose -f docker/docker-compose.yml up -d           # Arrancar todo
#   docker compose -f docker/docker-compose.yml up api dashboard # API + Dashboard
#   docker compose -f docker/docker-compose.yml run --rm lab python run_lab.py --demo
#   docker compose -f docker/docker-compose.yml run --rm lab python run_lab.py --model gemma4:e2b --all-vectors
# =============================================================

services:

  # ── LABORATORIO PYTHON ────────────────────────────────────
  lab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-security-lab
    
    volumes:
      # Persistir resultados en el host
      - ../lab/results:/lab/lab/results
      # Montar payloads del host
      - ../lab/payloads:/lab/lab/payloads
      # Logs
      - ../lab/logs:/lab/lab/logs
    
    environment:
      # Ollama en el host (Windows/Mac)
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemma4:e2b}
      - NUM_CTX=${NUM_CTX:-127000}
      - RESULTS_DIR=/lab/lab/results
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Para Linux: resuelve host.docker.internal a la IP del host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    # Permitir interacción en terminal
    stdin_open: true
    tty: true
    
    # No ejecutar automáticamente — lanzar ataques explícitamente:
    # docker compose run --rm lab python run_lab.py --model gemma4:e2b --all-vectors
    command: python run_lab.py --help
    
    # No reiniciar automáticamente (es un comando, no un servicio)
    restart: "no"
    
    networks:
      - lab-network

  # ── DASHBOARD WEB ─────────────────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: ai-security-dashboard
    
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    
    volumes:
      # Servir los archivos del dashboard
      - ../dashboard:/usr/share/nginx/html:ro
      # Configuración nginx personalizada
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    
    # El dashboard siempre está disponible
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - lab-network
    
    labels:
      - "traefik.enable=false"

  # ── JUPYTER LAB ───────────────────────────────────────────
  jupyter:
    image: quay.io/jupyter/scipy-notebook:x86_64-2026-09-01
    container_name: ai-security-jupyter
    
    ports:
      - "127.0.0.1:8888:8888"
    
    environment:
      - JUPYTER_ENABLE_LAB=yes
      # Obligatorio y sin valor por defecto: docker/.env.example lo deja VACÍO a
      # propósito para que compose se niegue a arrancar sin un token propio.
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in docker/.env}
      - OLLAMA_HOST=http://host.docker.internal:11434
    
    volumes:
      - ../notebooks:/home/jovyan/notebooks
      - ../lab:/home/jovyan/work/lab
      - ../lab/results:/home/jovyan/work/lab/results
      # Auditoría 2026-09-17: el notebook 05 (y otros) usan ../lab desde notebooks/
      - ../lab:/home/jovyan/lab
    
    # Para Linux: resuelve host.docker.internal a la IP del host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    restart: unless-stopped
    
    networks:
      - lab-network

  # ── API FASTAPI ────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ai-security-api
    
    ports:
      - "127.0.0.1:8000:8000"
    
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NUM_CTX=${NUM_CTX:-127000}
      # Defensa live: bloqueo real de salidas "dangerous" (false = solo alerta)
      - DEFENSE_BLOCK_DANGEROUS_OUTPUT=${DEFENSE_BLOCK_DANGEROUS_OUTPUT:-false}
      - DEFENSE_STRICT_MODE=${DEFENSE_STRICT_MODE:-false}
      # Revisiones de payload opcionales (p. ej. indirect_004=2). Vacío = revisión 1.
      - PAYLOAD_REVISIONS=${PAYLOAD_REVISIONS:-}
      - INDIRECT_SPOTLIGHTING=${INDIRECT_SPOTLIGHTING:-false}
      # Orígenes CORS permitidos (dashboard)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # GitHub Sync — token compartido del equipo TFM
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-alemeyerso/TFM-AI-Security-Lab}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - ENABLE_GITHUB_SYNC=${ENABLE_GITHUB_SYNC:-false}
    
    # Carga variables de .env automáticamente
    env_file:
      - path: ./.env
        required: false
    
    volumes:
      # Auditoría 2026-09-17 (GAP-014): código y payloads en SOLO LECTURA;
      # solo lab/results es escribible (resultados live y withheld/).
      - ../lab:/app/lab:ro
      - ../lab/results:/app/lab/results
    
    # Para Linux: resuelve host.docker.internal a la IP del host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
    name: ai-security-network

# =============================================================
# COMANDOS ÚTILES:
#
# Arrancar todo:
#   docker compose -f docker/docker-compose.yml up -d
#
# Solo el dashboard:
#   docker compose -f docker/docker-compose.yml up -d dashboard
#
# API + Dashboard (para uso del panel live):
#   docker compose -f docker/docker-compose.yml up -d api dashboard
#
# URLs de acceso:
#   → Dashboard: http://127.0.0.1:8080
#   → API Live:  http://127.0.0.1:8000/docs (Swagger UI)
#   → Jupyter:   http://localhost:8888 (token definido en docker/.env)
#
# Ver logs en tiempo real:
#   docker compose -f docker/docker-compose.yml logs -f api
#
# Parar todo:
#   docker compose -f docker/docker-compose.yml down
#
# Reconstruir imagen API (tras cambios en server.py):
#   docker compose -f docker/docker-compose.yml build api
#   docker compose -f docker/docker-compose.yml up -d api
#
# Ejecutar evaluación completa:
#   docker compose -f docker/docker-compose.yml run --rm lab \
#     python run_lab.py --model gemma4:e2b --all-vectors
# =============================================================
